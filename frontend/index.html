<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multistep Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Awesome Form</h1>

    <div id="step-1" class="form-step active">
        <h2>Step 1: Your Details</h2>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <button type="button" id="next-btn-1">Next</button>
    </div>

    <div id="step-2" class="form-step">
        <h2>Step 2: Your Interests</h2>
        <label for="interest">Main Interest:</label>
        <input type="text" id="interest" name="interest"><br><br>

        <label for="experience">Experience Level:</label>
        <select id="experience" name="experience">
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
        </select><br><br>

        <button type="button" id="prev-btn-2">Previous</button>
        <button type="button" id="next-btn-2">Next</button>
    </div>

    <div id="step-final" class="form-step">
        <h2>Final Step: Comments</h2>
        <label for="comments">Comments:</label><br>
        <textarea id="comments" name="comments" rows="4" cols="50"></textarea><br><br>

        <button type="button" id="prev-btn-final">Previous</button>
        <button type="button" id="submit-btn">Submit Form</button>
    </div>

    <div id="response-message"></div>

    <script src="script.js"></script>
</body>
</html>
